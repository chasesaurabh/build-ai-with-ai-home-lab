services:
  intake-api:
    build:
      context: .
      target: runtime
    environment:
      APP_ADAPTER: ${APP_ADAPTER:-deterministic}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:8100}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18081:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
